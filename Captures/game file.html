<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job applcation form</title>
    <link rel="stylesheet" href="mcnm.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="title"> job application</div>
        <form action="#">
            <div class="User-details">
                <div class="input-box">
                    <span class="details">Full Name</span>
                    <input type="text" placeholder="Name..." required>
                </div>
                <div class="input-box">
                    <span class="details">UserName</span>
                    <input type="text" placeholder="UserName..." required>
                </div>
                <div class="input-box">
                    <span class="details">Email</span>
                    <input type="text" placeholder="Email..." required>
                </div>
                <div class="input-box">
                    <span class="details">Phone Number</span>
                    <input type="text" placeholder="Number..." required>
                </div>
                <div class="input-box">
                    <span class="details">Whasapp No</span>
                    <input type="text" placeholder="Whasapp No..." required>
                </div>
                <div class="input-box">
                    <button type="button" id="sendCodeBtn">send code</button>
                    <label for="verifyCode">verification code:</label>
                    <input type="text" id="verifyCode" placeholder="Enter 6 digit code" required>
                </div>
            </div>
            <div class="gender-details">
                <input type="radio" name="gender" id="dot1" required>
                <input type="radio" name="gender" id="dot2" required>
                <span class="gender-title">Gender</span>
                <div class="category">
                    <label for="dot1">
                        <span class="dot one"></span>
                        <span class="gender">Male</span>
                    </label>
                    <label for="dot2">
                        <span class="dot two"></span>
                        <span class="gender">Female</span>
                    </label>
                </div>
            </div>
            <div class="button">
                <input type="submit"  value="submit">
          
        </div>
            <a href="=.html">m</a>
            <script src="mbb.js"></script>
        </form>
    </div>
</body>
</html>
